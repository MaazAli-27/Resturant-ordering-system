<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Savoria Restaurant — Fresh ingredients, bold flavors, unforgettable meals." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
    <title>Savoria Restaurant</title>
    <style>
      html { scroll-behavior: smooth; }
      body { margin: 0; }
      .initial-loader { position: fixed; inset: 0; background: #1a1a2e; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; z-index: 9999; transition: opacity 0.5s; }
      .initial-loader.hidden { opacity: 0; pointer-events: none; }
      .loader-icon { font-size: 4rem; animation: loaderSpin 2s ease-in-out infinite; }
      .loader-text { color: #f4c542; font-family: Georgia, serif; font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; }
      .loader-bar { width: 200px; height: 3px; background: rgba(244,197,66,0.2); border-radius: 2px; overflow: hidden; }
      .loader-bar-fill { height: 100%; background: #f4c542; border-radius: 2px; animation: loaderFill 1.5s ease-in-out infinite; }
      @keyframes loaderSpin { 0%,100% { transform: rotate(-10deg) scale(1); } 50% { transform: rotate(10deg) scale(1.1); } }
      @keyframes loaderFill { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
  </head>
  <body>
    <div class="initial-loader" id="initialLoader">
      <div class="loader-icon">🍽️</div>
      <div class="loader-text">Savoria</div>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initialLoader');
          if (loader) { loader.classList.add('hidden'); setTimeout(() => loader.remove(), 500); }
        }, 800);
      });
    </script>
  </body>
</html>
